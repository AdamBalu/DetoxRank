buildscript {
    ext {
        compose_version = '1.6.7'
        material3_version = '1.2.1'
        lifecycle_version = '2.8.0'
        room_version = '2.8.4' // 2.6.x KSP processor is incompatible with KSP2 (Kotlin 2.x)
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'com.android.library' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    // Kotlin 2.x moved the Compose compiler into the Kotlin repo — this plugin replaces composeOptions
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
    // 2.51 cannot read Kotlin 2.2 metadata; 2.59+ requires AGP 9 — 2.58 is the newest AGP-8-compatible line
    id 'com.google.dagger.hilt.android' version '2.58' apply false
    id 'com.google.devtools.ksp' version '2.2.10-2.0.2' apply false
}